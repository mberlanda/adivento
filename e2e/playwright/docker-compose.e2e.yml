services:
  ui-tests:
    build:
      # Paths resolve relative to the PRIMARY compose file (project root)
      # when merged via -f, so we must spell out the full path from root.
      context: ./e2e/playwright
      dockerfile: Dockerfile
    environment:
      BASE_URL: http://web:3000
      DOCKER: "1"
    volumes:
      - ./e2e/playwright/playwright-report:/e2e/playwright-report
    networks:
      - default
    # No depends_on — scripts/e2e.sh waits for web healthy before invoking
    # this container. --no-deps prevents docker compose from touching the
    # already-running web/db containers.

networks:
  default:
    name: adivento_default
    external: true
