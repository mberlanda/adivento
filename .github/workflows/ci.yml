name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      RAILS_ENV: test
      BUNDLE_WITHOUT: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.6"

      - name: Install pinned bundler
        run: gem install bundler -v "$(awk '/BUNDLED WITH/{getline; print $1}' Gemfile.lock)"

      - name: Install gems
        run: bundle install

      - name: Load test schema
        run: bin/rails db:schema:load RAILS_ENV=test

      - name: Run validation
        run: scripts/validate.sh

      - name: Upload SimpleCov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start application stack
        run: docker compose up -d --build

      - name: Wait for web service health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/up && exit 0
            echo "Attempt $i/30 — retrying in 5s..."
            sleep 5
          done
          docker compose logs web
          exit 1

      - name: Run Playwright E2E tests
        run: |
          docker compose \
            -f docker-compose.yml \
            -f e2e/playwright/docker-compose.e2e.yml \
            run --build --rm ui-tests

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright/playwright-report/
          if-no-files-found: ignore

      - name: Tear down stack
        if: always()
        run: docker compose down -v
